# Pack-owned defaults for Maid Useful Tasks 1.4.2.
# Logging remains globally enabled; individual behavior is configured per maid.

[misc]
self_rescue = true

[functions]
logging = true
revive = false
locate = false

[revive]
aggro = false
totem = true
passive = true

[revive.passive_priority]
1 = ["touhou_little_maid:idle"]
2 = []
4 = ["touhou_little_maid:attack", "touhou_little_maid:ranged_attack", "touhou_little_maid:crossbow_attack", "touhou_little_maid:danmaku_attack", "touhou_little_maid:trident_attack"]

[logging]
disable_blockup = false

[vehicle_control]
full = true
rotate = true
